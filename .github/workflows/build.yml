
name: Build and verify PVC-Hub

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Android SDK installation
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          sdkmanager --list_installed

      - name: Run checks and build debug
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    env:
      PVC_RELEASE_KEYSTORE_BASE64: ${{ secrets.PVC_RELEASE_KEYSTORE_BASE64 }}
      PVC_RELEASE_STORE_PASSWORD: ${{ secrets.PVC_RELEASE_STORE_PASSWORD }}
      PVC_RELEASE_KEY_ALIAS: ${{ secrets.PVC_RELEASE_KEY_ALIAS }}
      PVC_RELEASE_KEY_PASSWORD: ${{ secrets.PVC_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Skip release when signing secrets are not configured
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 == '' }}
        run: echo "Release skipped: configure the four PVC_RELEASE_* repository secrets."

      - name: Check out source
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/checkout@v4

      - name: Set up Java 17
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare release signing material
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PVC_RELEASE_STORE_PASSWORD"
          test -n "$PVC_RELEASE_KEY_ALIAS"
          test -n "$PVC_RELEASE_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/pvc-signing"
          printf '%s' "$PVC_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pvc-signing/release.jks"
          test -s "$RUNNER_TEMP/pvc-signing/release.jks"
          echo "PVC_RELEASE_STORE_FILE=$RUNNER_TEMP/pvc-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        run: gradle assembleRelease --no-daemon

      - name: Verify release APK signature
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Name release APK
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^" ]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "PVC-Hub-$VERSION.apk"

      - name: Upload signed release APK
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PVC-Hub-release-${{ github.run_number }}
          path: PVC-Hub-*.apk
          if-no-files-found: error
