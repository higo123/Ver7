name: Build and verify PVC-Hub

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run checks and build debug (internal verification only)
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    env:
      PVC_RELEASE_KEYSTORE_BASE64: ${{ secrets.PVC_RELEASE_KEYSTORE_BASE64 }}
      PVC_RELEASE_STORE_PASSWORD: ${{ secrets.PVC_RELEASE_STORE_PASSWORD }}
      PVC_RELEASE_KEY_ALIAS: ${{ secrets.PVC_RELEASE_KEY_ALIAS }}
      PVC_RELEASE_KEY_PASSWORD: ${{ secrets.PVC_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Skip release when signing secrets are not configured
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 == '' }}
        run: 'echo \"Release skipped: configure the four PVC_RELEASE_* repository secrets.\"'

      - uses: actions/checkout@v4
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}

      - uses: actions/setup-java@v4
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        with:
          gradle-version: "8.10.2"

      - name: Prepare release signing material
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          test -n "$PVC_RELEASE_STORE_PASSWORD"
          test -n "$PVC_RELEASE_KEY_ALIAS"
          test -n "$PVC_RELEASE_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/pvc-signing"
          printf '%s' "$PVC_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pvc-signing/release.jks"
          echo "PVC_RELEASE_STORE_FILE=$RUNNER_TEMP/pvc-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        run: gradle assembleRelease --no-daemon

      - name: Verify release APK is signed
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Name release APK
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          V=$(grep -oP 'versionName = "\K[^" ]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "PVC-Hub-$V.apk"

      - uses: actions/upload-artifact@v4
        if: ${{ env.PVC_RELEASE_KEYSTORE_BASE64 != '' }}
        with:
          name: PVC-Hub-release-${{ github.run_number }}
          path: PVC-Hub-*.apk
          if-no-files-found: error
